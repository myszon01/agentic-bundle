name: Publish packages

# Builds one native package per tool and force-pushes each to its own branch
# (dist/claude, dist/gemini, ...) so tools can install straight from git.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node bin/agentic-bundle.js build all --out "$RUNNER_TEMP/dist"
      - name: Push packages to dist/* branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in "$RUNNER_TEMP"/dist/*/; do
            target=$(basename "$dir")
            branch="dist/$target"
            git checkout -q --orphan "$branch"
            git rm -rqf .
            git clean -fdxq
            cp -a "$dir". .
            git add -A
            git commit -qm "Build $target package from ${GITHUB_SHA::7}"
            git push -qf origin "HEAD:refs/heads/$branch"
            git checkout -qf "$GITHUB_SHA"
          done
