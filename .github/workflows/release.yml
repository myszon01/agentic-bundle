name: Release

# Push a tag like v0.2.0 on main to release the CLI and one npm package per tool
# (see README → Releasing). Packages are *staged* on npm by default and go live once a
# maintainer approves them with 2FA (`npm run approve`). Run manually for a dry run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack everything, but don't publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC), if configured

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: node bin/agentic-bundle.js validate
      - name: Tag, package.json and bundle.json versions must match
        if: github.ref_type == 'tag'
        run: |
          pkg=$(node -p "require('./package.json').version")
          bundle=$(node -p "require('./harness/bundle.json').version")
          echo "tag=$GITHUB_REF_NAME package.json=$pkg bundle.json=$bundle"
          test "$GITHUB_REF_NAME" = "v$pkg" && test "$pkg" = "$bundle"
      - id: list
        run: echo "list=$(node scripts/packages.js)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: scripts/pack.sh "${{ matrix.package }}" artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}
          path: artifacts/*.tgz
          if-no-files-found: error
      - name: npm with staged publishing
        run: npm install -g npm@12
      - name: Stage on npm (or publish, if NPM_PUBLISH_MODE=publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # "stage" (default): upload without 2FA; a maintainer approves with `npm run approve`.
          # "publish": go live immediately; needs a token (or trusted publisher) allowed to publish.
          MODE: ${{ vars.NPM_PUBLISH_MODE || 'stage' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          tgz=$(ls ./artifacts/*.tgz)
          meta=$(tar -xOzf "$tgz" package/package.json)
          name=$(node -p "JSON.parse(process.argv[1]).name" "$meta")
          version=$(node -p "JSON.parse(process.argv[1]).version" "$meta")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MODE" = stage ]; then
            # Re-runs: a version that is already staged can't be staged again.
            staged=$(npm stage list "$name" --json 2>/dev/null || echo '[]')
            if node -e "process.exit(JSON.parse(process.argv[1]).some(i => i.version === process.argv[2] && i.status !== 'rejected') ? 0 : 1)" "$staged" "$version"; then
              echo "$name@$version is already staged; skipping" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cmd="npm stage publish"
          else
            cmd="npm publish"
          fi
          flags="--access public"
          note=""
          if [ "$DRY_RUN" = true ]; then flags="$flags --dry-run"; note="(dry run) "; fi
          $cmd "$tgz" $flags
          if [ "$MODE" = stage ]; then
            echo "${note}Staged \`$name@$version\`: approve with \`npm run approve\` (2FA)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "${note}Published \`$name@$version\`." >> "$GITHUB_STEP_SUMMARY"
          fi
