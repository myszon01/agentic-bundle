name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/agentic-bundle.js validate
      - run: node bin/agentic-bundle.js build all
      - name: Install round trip
        run: |
          dir=$(mktemp -d)
          node bin/agentic-bundle.js install all --dir "$dir"
          node bin/agentic-bundle.js uninstall all --dir "$dir"
          test -z "$(ls -A "$dir")"

  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: list
        run: echo "list=$(node scripts/packages.js)" >> "$GITHUB_OUTPUT"

  # One npm tarball per tool (plus the CLI), each uploaded as its own artifact.
  package:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: scripts/pack.sh "${{ matrix.package }}" artifacts
      # Once a version is on npm, a dry run fails with "cannot publish over"; skip it until the next bump.
      - name: Check the tarball would publish
        run: |
          tgz=$(ls ./artifacts/*.tgz)  # the ./ matters: npm reads "artifacts/x.tgz" as a GitHub repo
          spec=$(tar -xOzf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "$spec is already on npm; skipping the publish dry run (bump the version to release)."
          else
            npm publish "$tgz" --dry-run --access public
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}
          path: artifacts/*.tgz
          if-no-files-found: error

  # Single stable check for branch protection, so the required check
  # doesn't change whenever the matrices do.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success
